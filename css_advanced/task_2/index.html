<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmileSchool</title>
    <!-- Critical: Ensure file name matches styles.css exactly -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 1. HEADER SECTION -->
    <header class="header">
        <a href="#" class="logo-link">
            <img class="logo-icon" src="images/smile-off.png" alt="logo icon">
            <img class="logo-text" src="images/logo-text.png" alt="logo text">
        </a>
        <nav class="navbar">
            <a href="#">COURSES</a>
            <a href="#">PRICING</a>
            <a href="#">LOGIN</a>
        </nav>
    </header>

    <main>
        <!-- HERO SECTION -->
        <section class="hero">
            <h1>Get schooled</h1>
            <div class="keywords">
                <span>SMILES</span>
                <span>GRIN</span>
                <span>LAUGH</span>
            </div>
            <button class="btn-primary">REGISTER FOR FREE</button>
            
            <!-- Structural Fix: Converted tag layout block from p to h2 -->
            <h2 class="pros-title"><span class="purple-text">Learn</span> from the pros</h2>

            <div class="pros-grid">
                <div class="pro-card">
                    <img src="images/profile-1.png" alt="Phillip Massey">
                    <h3>Phillip Massey</h3>
                    <!-- Structural Fix: Cleared layout special quote characters -->
                    <p>Smile of the year<br>2018-2019</p>
                </div>
                <div class="pro-card">
                    <img src="images/profile-2.png" alt="Nannie Lawrence">
                    <h3>Nannie Lawrence</h3>
                    <p>Best little smile<br>2017</p>
                </div>
                <div class="pro-card">
                    <img src="images/profile-3.png" alt="Bruce Walters">
                    <h3>Bruce Walters</h3>
                    <p>Best Friend Smile<br>live performance 2019</p>
                </div>
                <div class="pro-card">
                    <img src="images/profile-4.png" alt="Henry Hughes">
                    <h3>Henry Hughes</h3>
                    <p>24h smiles winner<br>2016-2019</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
