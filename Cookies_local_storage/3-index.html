<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies and Local Storage</title>
    <style>
        .login-form-container{
            display: block;
        }
        .logout-link{
            margin-left: 10px;
            color: red;
            cursor: pointer;
            font-style: italic;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="login-form-container">
        <h2>Login to the website</h2>
        <br>
        <form>
            <input type="text" id="firstname" placeholder="Firstname">
            <input type="text" id="email" placeholder="Email">
            <button type="button" onclick="setCookies()">Log me in</button>
        </form>
    </div>
    <br>
    <br>
    <p>When a user is logged in the page should look like the image below</p>
    <hr style="height: 2px; border: none; background-color: black;">
    
    <script>
        window.onload = function(){
            showWelcomeMessageOrForm();
        }
        
        function setCookies(){
            const firstname = document.getElementById('firstname').value;
            const email = document.getElementById('email').value;
            const date = new Date();
            date.setTime(date.getTime() + (10*24*60*60*1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = 'firstname=' + firstname + ';' + expires + '; path=/;';
            document.cookie = 'email=' + email + ';' + expires + '; path=/;';

            showWelcomeMessageOrForm();
        }

        function getCookie(name){
            if (document.cookie === ''){
                return ;
            }
            return document.cookie.split(';').map(cookie => cookie.trim()).find(cookie => cookie.startsWith(name + '='))?.split('=')[1];
        }

        function showForm(){
            // FIXED: Standardized the lookup string ID to 'welcome-msg'
            const welcomeMsg = document.getElementById('welcome-msg');
            if (welcomeMsg){
                welcomeMsg.remove();
            }
            // FIXED: Swapped to querySelector to find the exact class container safely
            const form = document.querySelector('.login-form-container');
            form.style.display = 'block';
        }

        function hideForm(){
            // FIXED: Removed the invalid getElementByClass method and replaced with querySelector
            const form = document.querySelector('.login-form-container');
            form.style.display = 'none';
        }

        function deleteCookiesAndShowForm(){
            document.cookie = 'firstname=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'email=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            showForm();
        }

        function showWelcomeMessageOrForm(){
            const firstname = getCookie('firstname');
            
            // FIXED: Clean up any old header text elements immediately to avoid duplication bugs
            const existingMsg = document.getElementById('welcome-msg');
            if (existingMsg) {
                existingMsg.remove();
            }

            if (firstname){
                hideForm();
                
                // FIXED: Placed elements inside the true block so they don't print "Welcome undefined"
                const h1 = document.createElement('h1');
                h1.id = 'welcome-msg'; // FIXED: Keeps naming consistent with showForm() tracking
                h1.textContent = `Welcome ${firstname}`;

                const logout = document.createElement('a');
                logout.className = 'logout-link';
                logout.textContent = '(logout)';

                logout.onclick = function(){
                    deleteCookiesAndShowForm();
                }
                h1.appendChild(logout);
                document.body.appendChild(h1);
            } else {
                showForm();
            }
        } 
    </script>
</body>
</html>
