<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies and Local Storage</title>
    <style>
        .login-form-container{
            display: block;
        }
        .logout-link{
            margin-left: 10px;
            color: red;
            cursor: pointer;
            font-style: italic;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="login-form-container">
        <h2>Login to the website</h2>
        <br>
        <form>
            <input type="text" id="firstname" placeholder="Firstname">
            <input type="text" id="email" placeholder="Email">
            <button type="button" onclick="setCookiesAndShowWelcomeMessage()">Log me in</button>
        </form>
    </div>
    <br>
    <br>
    <p>When a user is logged in the page should look like the image below</p>
    <hr style="height: 2px; border: none; background-color: black;">

    <script src="https://cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js"></script>
    <script>
        window.onload = function(){
            showWelcomeMessageOrForm();
        }
        
        function setCookiesAndShowWelcomeMessage(){
            const firstname = document.getElementById('firstname').value;
            const email = document.getElementById('email').value;
            Cookies.set('firstname', firstname, {expires: 10, path: '/'});
            Cookies.set('email', email, {expires: 10, path: '/'});
            showWelcomeMessageOrForm();
        }


        function showForm(){
            const welcomeMsg = document.getElementById('welcome-msg');
            if (welcomeMsg){
                welcomeMsg.remove();
            }
            const form = document.querySelector('.login-form-container');
            form.style.display = 'block';
        }

        function hideForm(){
            const form = document.querySelector('.login-form-container');
            form.style.display = 'none';
        }

        function deleteCookiesAndShowForm(){
            Cookies.remove('firstname', { path: '/' });
            Cookies.remove('email', { path: '/' });
            showForm();
        }

        function showWelcomeMessageOrForm(){
            const firstname = Cookies.get('firstname');
            
            const existingMsg = document.getElementById('welcome-msg');
            if (existingMsg) {
                existingMsg.remove();
            }

            if (firstname){
                hideForm();
                
                const h1 = document.createElement('h1');
                h1.id = 'welcome-msg'; 
                 h1.textContent = `Welcome ${firstname}`;

                const logout = document.createElement('a');
                logout.className = 'logout-link';
                logout.textContent = '(logout)';

                logout.onclick = function(){
                    deleteCookiesAndShowForm();
                }
                h1.appendChild(logout);
                document.body.appendChild(h1);
            } else {
                showForm();
            }
        } 
    </script>
</body>
</html>
