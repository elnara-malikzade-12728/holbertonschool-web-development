<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies and Local Storage</title>
</head>
<body>
    <h1>Login to the website</h1>
    <br>
    <form>
        <input type="text" id="firstname" placeholder="Firstname">
        <input type="text" id="email" placeholder="Email">
        <button type="button" onclick="setCookies()">Log me in</button>
    </form>
    <h1>Cookies</h1>
    <button type="button" onclick="showCookies()">Show the cookies</button>
    <script>
        function setCookies(){
            document.cookie = 'firstname=John; expires=31 May 2026';
            document.cookie = 'email=john@example.com; expires=31 May 2026 12:00:00 UTC';
        }
        function getCookie(name){
            if (document.cookie === ''){
                return ;
            }

            return document.cookie.split(';').map(cookie => cookie.trim()).find(cookie => cookie.startsWith(name + '='))?.split('=')[1];
        }
        function showCookies(){
            const p = document.createElement('p');
            const email = getCookie('email');
            const firstname = getCookie('firstname');
            p.innerHTML = 'Email: ' + email + ' - Firstname: ' + firstname;
            document.body.appendChild(p);
        }
    </script>

    
</body>
</html>
